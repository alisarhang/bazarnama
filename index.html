<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بازارنما — طلا و دلار</title>
<meta name="theme-color" content="#14161A">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14161A;
    --panel:#1C1F24;
    --panel-2:#20242A;
    --hair:#2C3038;
    --brass:#C9A227;
    --brass-dim:#8A7220;
    --jade:#2F8C77;
    --jade-dim:#1E5A4C;
    --ink:#EDEAE1;
    --muted:#8B8F94;
    --up:#4CAF7D;
    --down:#D9695F;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);}
  body{
    font-family:'Vazirmatn',sans-serif;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap{width:100%;max-width:480px;padding:18px 16px 40px;}

  /* header */
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:8px 2px 22px;
  }
  .brand{display:flex;flex-direction:column;gap:2px;}
  .brand .name{font-size:20px;font-weight:900;letter-spacing:.3px;}
  .brand .clock{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .refresh-ring{
    position:relative;width:46px;height:46px;flex-shrink:0;cursor:pointer;
  }
  .refresh-ring svg{width:100%;height:100%;transform:rotate(-90deg);}
  .refresh-ring circle{fill:none;stroke-width:3;}
  .refresh-ring .track{stroke:var(--hair);}
  .refresh-ring .bar{stroke:var(--brass);stroke-linecap:round;transition:stroke-dashoffset 1s linear;}
  .refresh-ring .icon{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:15px;color:var(--ink);
  }
  .refresh-ring.spinning .icon{animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* status line */
  .status{
    font-size:12.5px;color:var(--muted);
    display:flex;align-items:center;gap:6px;
    padding:0 2px 16px;
  }
  .status .dot{width:6px;height:6px;border-radius:50%;background:var(--muted);}
  .status.ok .dot{background:var(--up);}
  .status.err .dot{background:var(--down);}

  /* toggle */
  .unit-toggle{
    display:flex;background:var(--panel);border:1px solid var(--hair);
    border-radius:10px;padding:3px;margin:0 2px 18px;width:fit-content;
    font-size:12.5px;
  }
  .unit-toggle button{
    border:none;background:transparent;color:var(--muted);
    padding:6px 14px;border-radius:8px;font-family:inherit;font-size:inherit;
    cursor:pointer;
  }
  .unit-toggle button.active{background:var(--panel-2);color:var(--ink);font-weight:600;}

  /* cards */
  .card{
    position:relative;
    background:var(--panel);
    border:1px solid var(--hair);
    border-radius:12px;
    padding:18px 18px 18px 16px;
    margin-bottom:14px;
    overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;top:0;bottom:0;right:0;width:4px;
  }
  .card.gold::before{background:var(--brass);}
  .card.fx::before{background:var(--jade);}
  .card-top{display:flex;align-items:baseline;justify-content:space-between;}
  .card-label{font-size:13.5px;color:var(--muted);}
  .card-sub{font-size:11.5px;color:var(--muted);opacity:.75;}
  .price-row{
    display:flex;align-items:flex-end;justify-content:space-between;
    margin-top:10px;
  }
  .price{
    font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;
    letter-spacing:.2px;
  }
  .price .unit{font-size:14px;font-weight:500;color:var(--muted);margin-right:6px;}
  .delta{
    font-size:13px;font-weight:600;display:flex;align-items:center;gap:3px;
    font-variant-numeric:tabular-nums;
  }
  .delta.up{color:var(--up);}
  .delta.down{color:var(--down);}
  .delta.flat{color:var(--muted);}
  .card-time{margin-top:10px;font-size:11px;color:var(--muted);}

  .skeleton{
    background:linear-gradient(90deg,var(--panel-2) 25%,var(--hair) 37%,var(--panel-2) 63%);
    background-size:400% 100%;animation:shimmer 1.4s infinite;
    border-radius:6px;height:30px;width:60%;
  }
  @keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}

  .not-found{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.8;}

  .errbox{
    background:var(--panel);border:1px solid var(--down);border-radius:12px;
    padding:16px;font-size:13.5px;line-height:2;color:var(--ink);margin-bottom:16px;
  }
  .errbox b{color:var(--down);}
  .errbox button{
    margin-top:8px;background:var(--brass);color:#1a1200;border:none;
    padding:8px 16px;border-radius:8px;font-family:inherit;font-weight:700;
    font-size:13px;cursor:pointer;
  }

  footer{margin-top:6px;text-align:center;font-size:11px;color:var(--muted);line-height:2;}
  footer a{color:var(--muted);}

  details.debug{margin-top:18px;font-size:12px;color:var(--muted);}
  details.debug summary{cursor:pointer;}
  details.debug pre{
    background:var(--panel);border:1px solid var(--hair);border-radius:8px;
    padding:10px;max-height:220px;overflow:auto;white-space:pre-wrap;word-break:break-all;
    font-size:11px;margin-top:8px;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="name">بازارنما</div>
      <div class="clock" id="clock">—</div>
    </div>
    <div class="refresh-ring" id="refreshRing" title="بروزرسانی دستی">
      <svg viewBox="0 0 46 46">
        <circle class="track" cx="23" cy="23" r="19"></circle>
        <circle class="bar" id="ringBar" cx="23" cy="23" r="19"></circle>
      </svg>
      <div class="icon" id="ringIcon">↻</div>
    </div>
  </header>

  <div class="status" id="status"><span class="dot"></span><span id="statusText">در حال دریافت اطلاعات…</span></div>

  <div class="unit-toggle" id="unitToggle">
    <button data-unit="toman" class="active">تومان</button>
    <button data-unit="rial">ریال</button>
  </div>

  <div id="cards">
    <div class="card gold">
      <div class="card-top"><span class="card-label">انس جهانی طلا</span><span class="card-sub">XAU/USD</span></div>
      <div class="price-row"><div class="skeleton"></div></div>
    </div>
    <div class="card fx">
      <div class="card-top"><span class="card-label">دلار آمریکا</span><span class="card-sub">بازار آزاد</span></div>
      <div class="price-row"><div class="skeleton"></div></div>
    </div>
    <div class="card gold">
      <div class="card-top"><span class="card-label">طلای ۱۸ عیار</span><span class="card-sub">هر گرم</span></div>
      <div class="price-row"><div class="skeleton"></div></div>
    </div>
  </div>

  <div id="errArea"></div>

  <footer>
    داده هر چند دقیقه یک‌بار سمت GitHub بروز می‌شود · منبع: tgju.org<br>
    برای نصب روی صفحه اصلی، از منوی مرورگر «افزودن به صفحه اصلی» را بزنید
  </footer>

  <details class="debug">
    <summary>نمایش داده خام (عیب‌یابی)</summary>
    <pre id="rawDump">—</pre>
  </details>

</div>

<script>
(function(){
  // Data is no longer fetched from tgju.org in the browser. Instead, a
  // GitHub Actions workflow (server-side, on GitHub's own network) fetches
  // it every ~5 minutes and commits it as data.json next to this file.
  // The browser only ever talks to GitHub Pages -- this avoids CORS issues
  // and works even if the visitor's own network can't reach tgju.org.
  var SOURCE = './data.json';
  var POLL_MS = 60000; // how often the page checks data.json for a change
  var unitMode = 'toman'; // toman | rial
  var lastData = null;
  var countdownTimer = null;
  var secondsLeft = POLL_MS/1000;

  var els = {
    clock: document.getElementById('clock'),
    status: document.getElementById('status'),
    statusText: document.getElementById('statusText'),
    cards: document.getElementById('cards'),
    errArea: document.getElementById('errArea'),
    rawDump: document.getElementById('rawDump'),
    ring: document.getElementById('refreshRing'),
    ringBar: document.getElementById('ringBar'),
    unitToggle: document.getElementById('unitToggle')
  };

  var RING_R = 19, RING_C = 2*Math.PI*RING_R;
  els.ringBar.style.strokeDasharray = RING_C;

  function tickClock(){
    var d = new Date();
    els.clock.textContent = d.toLocaleTimeString('fa-IR', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  }
  setInterval(tickClock, 1000);
  tickClock();

  function fa(n){
    if (n === null || n === undefined || isNaN(n)) return '—';
    return Math.round(n).toLocaleString('fa-IR');
  }
  function timeOnly(iso){
    if (!iso) return '—';
    try { return new Date(iso).toLocaleTimeString('fa-IR', {hour:'2-digit',minute:'2-digit'}); }
    catch(e){ return '—'; }
  }
  function nowStr(){
    return new Date().toLocaleTimeString('fa-IR', {hour:'2-digit',minute:'2-digit'});
  }
  function setStatus(state, text){
    els.status.className = 'status ' + state;
    els.statusText.textContent = text;
  }
  function showError(msg){
    els.errArea.innerHTML =
      '<div class="errbox"><b>خواندن data.json با خطا مواجه شد.</b><br>' + msg +
      '<br><button id="retryBtn">تلاش دوباره</button></div>';
    document.getElementById('retryBtn').addEventListener('click', function(){ loadData(true); });
  }
  function clearError(){ els.errArea.innerHTML = ''; }

  // ---------- render a single card ----------
  function renderCard(container, opts){
    // opts: {item: {price, change, direction}, isRialSource, forceUnit}
    var top = container.querySelector('.card-top').outerHTML;
    if (!opts.item || opts.item.price === null || opts.item.price === undefined){
      container.innerHTML = top +
        '<div class="not-found">داده این مورد هنوز در data.json موجود نیست.</div>';
      return;
    }
    var priceVal = opts.item.price;
    var changeVal = opts.item.change;
    var dir = opts.item.direction; // 'high' | 'low'

    var unitLabel = opts.forceUnit || '';
    var displayVal = priceVal;
    var displayChange = changeVal;
    if (opts.isRialSource){
      if (unitMode === 'toman'){
        if (displayVal !== null && displayVal !== undefined) displayVal = displayVal / 10;
        if (displayChange !== null && displayChange !== undefined) displayChange = displayChange / 10;
        unitLabel = 'تومان';
      } else {
        unitLabel = 'ریال';
      }
    }

    var chgClass = 'flat', chgSign = '', chgArrow = '＝';
    if (displayChange !== null && displayChange !== undefined && displayChange !== 0){
      if (dir === 'low'){ chgClass = 'down'; chgArrow = '▼'; }
      else { chgClass = 'up'; chgSign = '+'; chgArrow = '▲'; }
    }

    var priceRowHtml =
      '<div class="price-row">' +
        '<div class="price">' + fa(displayVal) + (unitLabel ? '<span class="unit">'+unitLabel+'</span>' : '') + '</div>' +
        (displayChange !== null && displayChange !== undefined ? '<div class="delta '+chgClass+'">'+chgArrow+' '+chgSign+fa(displayChange)+'</div>' : '') +
      '</div>';

    container.innerHTML = top + priceRowHtml +
      '<div class="card-time">آخرین بروزرسانی سرور: <span class="t">' + timeOnly(lastData && lastData.generated_at) + '</span></div>';
  }

  function processAndRender(json){
    lastData = json;
    els.rawDump.textContent = JSON.stringify(json, null, 2).slice(0, 8000);

    var cards = els.cards.children;
    renderCard(cards[0], { item: json.ounce, isRialSource: false, forceUnit: '$' });
    renderCard(cards[1], { item: json.usd_rial, isRialSource: true });
    renderCard(cards[2], { item: json.gold18_rial, isRialSource: true });

    if (json.ok === false && !json.generated_at){
      setStatus('err', 'هنوز اولین بروزرسانی روی GitHub انجام نشده');
      showError('workflow را از تب Actions مخزن، به‌صورت دستی (Run workflow) یک‌بار اجرا کنید تا data.json ساخته شود.');
      return;
    }
    if (json.ok === false){
      setStatus('err', 'آخرین تلاش سرور ناموفق بود — نمایش آخرین داده معتبر (' + timeOnly(json.generated_at) + ')');
    } else {
      setStatus('ok', 'بروز · داده سرور: ' + timeOnly(json.generated_at) + ' · بررسی شد: ' + nowStr());
    }
    clearError();
  }

  function fetchJson(url){
    return fetch(url, {cache:'no-store'}).then(function(res){
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    });
  }

  function loadData(isManual){
    if (isManual){ els.ring.classList.add('spinning'); setStatus('', 'در حال بررسی data.json…'); }
    fetchJson(SOURCE)
      .then(processAndRender)
      .catch(function(err){
        setStatus('err', 'data.json یافت نشد یا خطا داشت');
        showError('مطمئن شوید data.json کنار index.html در همان مخزن آپلود شده. جزئیات فنی: ' + (err && err.message ? err.message : 'نامشخص'));
      })
      .finally(function(){
        if (isManual){ setTimeout(function(){ els.ring.classList.remove('spinning'); }, 300); }
        resetCountdown();
      });
  }

  // ---------- countdown ring (how often we re-check data.json) ----------
  function resetCountdown(){
    secondsLeft = POLL_MS/1000;
    clearInterval(countdownTimer);
    countdownTimer = setInterval(function(){
      secondsLeft--;
      var frac = Math.max(0, secondsLeft) / (POLL_MS/1000);
      els.ringBar.style.strokeDashoffset = RING_C * (1 - frac);
      if (secondsLeft <= 0){
        loadData(false);
      }
    }, 1000);
  }

  els.ring.addEventListener('click', function(){ loadData(true); });

  els.unitToggle.addEventListener('click', function(e){
    var btn = e.target.closest('button');
    if (!btn) return;
    unitMode = btn.getAttribute('data-unit');
    Array.from(els.unitToggle.children).forEach(function(b){ b.classList.toggle('active', b===btn); });
    if (lastData) processAndRender(lastData);
  });

  loadData(false);

  if ('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){ /* ignore in sandboxed preview */ });
    });
  }
})();
</script>
</body>
</html>
